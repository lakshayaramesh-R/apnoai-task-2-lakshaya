
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakshaya Ramesh | Profile Card</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fce7f3, #ede9fe, #dbeafe);
      min-height: 100vh;
    }

    .profile-card {
      transition: all 0.3s ease;
      backdrop-filter: blur(15px);
    }

    .profile-card:hover {
      transform: translateY(-5px);
    }

    .dark-mode {
      background: #171329;
      color: white;
    }

    .dark-mode .profile-card {
      background: #29243d;
      color: white;
      border-color: #51466d;
    }

    .dark-mode .muted-text {
      color: #c4b5fd;
    }

    button {
      transition: all 0.2s ease;
    }

    button:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Profile Card Component
    function ProfileCard({
      name,
      role,
      bio,
      skills,
      avatar,
      github,
      linkedin
    }) {
      const [isDark, setIsDark] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [likes, setLikes] = useState(0);

      return (
        <div className={`min-h-screen flex items-center justify-center p-5 ${isDark ? "dark-mode" : ""}`}>

          <div className="profile-card w-full max-w-md bg-white/80 border border-white rounded-3xl shadow-2xl p-8 text-center">

            {/* Dark Mode Button */}
            <div className="flex justify-end mb-4">
              <button
                onClick={() => setIsDark(!isDark)}
                className="px-4 py-2 rounded-full bg-purple-100 text-purple-800 text-sm font-semibold"
              >
                {isDark ? "☀️ Light Mode" : "🌙 Dark Mode"}
              </button>
            </div>

            {/* Profile Image */}
            <div className="flex justify-center mb-5">
              <img
                src={avatar}
                alt={name}
                className="w-32 h-32 rounded-full object-cover border-4 border-purple-400 shadow-lg"
              />
            </div>

            {/* Name and Role */}
            <h1 className="text-3xl font-bold mb-2">
              {name}
            </h1>

            <p className="text-purple-600 font-semibold text-lg mb-4">
              {role}
            </p>

            {/* Bio */}
            <p className="muted-text text-gray-600 leading-relaxed mb-6">
              {bio}
            </p>

            {/* Skills */}
            <div className="mb-7">
              <h2 className="text-lg font-bold mb-3">
                My Skills
              </h2>

              <div className="flex flex-wrap justify-center gap-2">
                {skills.map((skill, index) => (
                  <span
                    key={index}
                    className="bg-purple-100 text-purple-800 px-4 py-2 rounded-full text-sm font-semibold"
                  >
                    {skill}
                  </span>
                ))}
              </div>
            </div>

            {/* Like Counter */}
            <div className="mb-4">
              <button
                onClick={() => setLikes(likes + 1)}
                className="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-full font-semibold shadow-md"
              >
                ❤️ Like {likes}
              </button>
            </div>

            {/* Connect Button */}
            <div className="mb-6">
              <button
                onClick={() => setIsConnected(!isConnected)}
                className={`w-full py-3 rounded-full font-bold shadow-md ${
                  isConnected
                    ? "bg-green-500 text-white"
                    : "bg-purple-600 hover:bg-purple-700 text-white"
                }`}
              >
                {isConnected ? "✓ Connected" : "Connect with Me"}
              </button>
            </div>

            {/* Social Links */}
            <div className="border-t border-purple-200 pt-5">
              <h2 className="font-bold text-lg mb-3">
                Find Me Online
              </h2>

              <div className="flex justify-center gap-5">
                {github && (
                  <a
                    href={github}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-purple-700 font-semibold hover:underline"
                  >
                    GitHub
                  </a>
                )}

                {linkedin && (
                  <a
                    href={linkedin}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-blue-700 font-semibold hover:underline"
                  >
                    LinkedIn
                  </a>
                )}
              </div>
            </div>

            <p className="muted-text text-sm mt-7 text-gray-500">
              Built with React 18
            </p>

          </div>
        </div>
      );
    }

    // Profile Data (Props)
    function App() {
      return (
        <ProfileCard
          name="Lakshaya Ramesh"
          role="Computer Science Student"
          bio="Passionate about building innovative digital experiences. Exploring Artificial Intelligence, web development, and modern technologies to create meaningful solutions."
          skills={["HTML", "CSS", "JavaScript", "Python"]}
          avatar="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop&crop=face"
          github="https://github.com/lakshayaramesh-R"
          linkedin=""
        />
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
